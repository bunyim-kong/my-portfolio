<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101211" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('portfolio-theme') === 'light' ? 'light' : 'dark'
      } catch { document.documentElement.dataset.theme = 'dark' }
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'light' ? '#f6f8f2' : '#101211'
    </script>
    <meta name="description" content="Kong Bunyim — full-stack developer in Phnom Penh. Explore web applications, GitHub projects, skills, and experience." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Kong Bunyim — Full-Stack Developer</title>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
